<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>贪吃蛇</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#1e90ff55,transparent 30%),linear-gradient(135deg,#07111f,#132b46);font-family:system-ui,"Microsoft YaHei";color:#eef;padding:14px}.wrap{width:min(94vw,680px)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;padding:12px 16px;border:1px solid #ffffff22;border-radius:18px;background:#ffffff12;backdrop-filter:blur(8px)}h1{margin:0;font-size:clamp(24px,5vw,36px)}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:8px 12px;color:#a9bdd0;font-weight:700}.pill b{color:white}.card{position:relative;padding:12px;border:1px solid #ffffff22;border-radius:22px;background:#0005;box-shadow:0 20px 70px #0008}canvas{width:100%;aspect-ratio:1;display:block;border-radius:14px;background:#07131f;touch-action:none}.overlay{position:absolute;inset:12px;display:grid;place-items:center;text-align:center;border-radius:14px;background:#020617aa;padding:18px}.hide{display:none}.box{max-width:430px}.box h2{font-size:clamp(30px,7vw,50px);margin:0 0 8px}.box p{color:#b7c7d8;line-height:1.6}.btn{border:0;border-radius:13px;padding:12px 18px;margin:5px;background:linear-gradient(#86efac,#22c55e);font-weight:900;color:#052e16;cursor:pointer}.btn2{background:#ffffff18;color:#fff;border:1px solid #ffffff22}.hint{text-align:center;color:#b7c7d8;margin-top:12px}.pad{display:none;grid-template-columns:repeat(3,56px);gap:7px;justify-content:center;margin-top:10px}.pad button{height:44px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff18;color:white;font-size:20px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.pad{display:grid}}
</style></head><body><main class="wrap"><section class="top"><h1>🐍 贪吃蛇</h1><div class="stats"><div class="pill">分数 <b id="score">0</b></div><div class="pill">最高 <b id="best">0</b></div><div class="pill">速度 <b id="speed">1</b></div></div></section><section class="card"><canvas id="c" width="600" height="600"></canvas><div id="ov" class="overlay"><div class="box"><h2 id="tt">准备开始</h2><p id="msg">方向键/WASD 控制，吃红果变长。撞墙或撞自己就结束。</p><p>空格暂停，Enter 开始。</p><button id="start" class="btn">开始游戏</button><button id="pause" class="btn btn2">暂停/继续</button></div></div></section><div class="hint">手机可滑动棋盘，或点击方向键</div><div class="pad"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=24,T=c.width/N,scoreEl=score,bestEl=best,speedEl=speed,ov=document.getElementById('ov'),tt=document.getElementById('tt'),msg=document.getElementById('msg');let snake,food,dir,next,sc,bestScore=+localStorage.snakeBest||0,run=false,pause=false,over=false,last=0,ms=145;bestEl.textContent=bestScore;function init(){snake=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];dir=next={x:1,y:0};sc=0;ms=145;run=pause=over=false;putFood();stat();draw();show('准备开始','吃掉红色食物得分，分数越高速度越快。')}function show(a,b){tt.textContent=a;msg.textContent=b;ov.classList.remove('hide')}function stat(){scoreEl.textContent=sc;bestEl.textContent=bestScore;speedEl.textContent=Math.floor((145-ms)/10)+1}function startGame(){if(over)init();run=true;pause=false;over=false;ov.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function toggle(){if(!run&&!over)return startGame();if(over)return;pause=!pause;if(pause)show('已暂停','按空格或点击按钮继续。');else{ov.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}}function loop(t){if(!run||pause||over)return;if(t-last>=ms){update();draw();last=t}requestAnimationFrame(loop)}function update(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y))return end();snake.unshift(h);if(h.x==food.x&&h.y==food.y){sc+=10;ms=Math.max(60,145-Math.floor(sc/50)*10);putFood()}else snake.pop();stat()}function end(){run=false;over=true;bestScore=Math.max(bestScore,sc);localStorage.snakeBest=bestScore;stat();draw();show('游戏结束',`你的分数是 ${sc}，再来一局吧！`);document.getElementById('start').textContent='重新开始'}function putFood(){do food={x:Math.random()*N|0,y:Math.random()*N|0};while(snake&&snake.some(p=>p.x==food.x&&p.y==food.y))}function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.fill()}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#07131f';x.fillRect(0,0,c.width,c.height);for(let j=0;j<N;j++)for(let i=0;i<N;i++){x.fillStyle=(i+j)%2?'#ffffff0b':'#ffffff06';x.fillRect(i*T,j*T,T,T)}x.shadowColor='#fb7185';x.shadowBlur=16;x.fillStyle='#fb7185';x.beginPath();x.arc(food.x*T+T/2,food.y*T+T/2,T*.34,0,7);x.fill();x.shadowBlur=0;snake.forEach((p,i)=>{let pad=i?4:2.5,a=p.x*T+pad,b=p.y*T+pad,s=T-pad*2,g=x.createLinearGradient(a,b,a+s,b+s);g.addColorStop(0,i?'#4ade80':'#86efac');g.addColorStop(1,i?'#16a34a':'#22c55e');x.fillStyle=g;rr(a,b,s,s,8);if(!i){x.fillStyle='#052e16';x.beginPath();x.arc(a+s*.35,b+s*.35,2.5,0,7);x.arc(a+s*.65,b+s*.65,2.5,0,7);x.fill()}})}function setD(n){let m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[n];if(!m)return;if(m.x+dir.x||m.y+dir.y)next=m;if(!run&&!over)startGame()}onkeydown=e=>{let k=e.key.toLowerCase();if(' arrowup arrowdown arrowleft arrowright w a s d enter'.includes(k)||k==' ')e.preventDefault();if(k=='arrowup'||k=='w')setD('up');if(k=='arrowdown'||k=='s')setD('down');if(k=='arrowleft'||k=='a')setD('left');if(k=='arrowright'||k=='d')setD('right');if(k==' ')toggle();if(k=='enter')startGame()};document.getElementById('start').onclick=startGame;document.getElementById('pause').onclick=toggle;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setD(b.dataset.d));let ts;c.ontouchstart=e=>{let t=e.changedTouches[0];ts={x:t.clientX,y:t.clientY}};c.ontouchend=e=>{if(!ts)return;let t=e.changedTouches[0],dx=t.clientX-ts.x,dy=t.clientY-ts.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setD(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};init();
</script></body></html>
